name: PHPStan

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - PHP_VERSION: php85-fpm
            MAGENTO_VERSION: 2.4.9

    name: Magento ${{ matrix.MAGENTO_VERSION }} - ${{ matrix.PHP_VERSION }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Magento container
        run: docker run --detach --name magento ghcr.io/controlaltdelete-nl/magento2-in-a-box/magento-project-community-edition:${{ matrix.PHP_VERSION }}-magento${{ matrix.MAGENTO_VERSION }}

      # Core has no tagged release yet, so it comes off Packagist's dev-main; its own AI base
      # dependency is unreleased too and needs the same alias core's CI uses. Drop both once tagged.
      # The LM Studio platform is only a suggestion of core's, installed here as core's own CI does.
      - name: Install Mago core and its AI base dependency
        run: |
          docker exec magento composer config repositories.mage-os-ai-base vcs https://github.com/mage-os-lab/module-ai-base
          docker exec magento ./retry "composer require --no-update mage-os/module-ai-base:'dev-main as 1.0.0'"
          docker exec magento ./retry "composer require --no-update symfony/ai-lm-studio-platform:'*'"
          docker exec magento ./retry "composer require --no-update mago-assistant/magento2-mago:dev-main"

      - name: Upload module into container
        run: |
          docker cp $(pwd) magento:/data/extensions/
          docker exec magento ./install-composer-package mago-assistant/magento2-vies:@dev

      - name: Activate extension
        run: |
          docker exec magento ./retry "php bin/magento module:enable MageOS_AiBase MagoAssistant_Mago MagoAssistant_Vies && php bin/magento setup:di:compile && php bin/magento setup:upgrade --keep-generated"

      - name: Run PHPStan
        run: docker exec magento /bin/bash -c "./vendor/bin/phpstan analyse --no-progress -c /data/extensions/*/phpstan.neon.dist /data/extensions"
